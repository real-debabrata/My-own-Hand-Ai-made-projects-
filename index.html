<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Universe | Portfolio</title>
    
    <!-- Prevent Caching -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Import Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-highlight: rgba(255, 255, 255, 0.2);
            --text-main: #ffffff;
            --text-secondary: #a1a1aa;
            --accent: #64ffda;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Fallback color */
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 3D Background Canvas */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #1e293b 0%, #000000 100%);
        }

        /* Main Layout */
        main {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 4rem;
            animation: fadeIn 1.5s ease-out;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* Grid System */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        /* Glassmorphism Card */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2rem;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            opacity: 0; /* Hidden initially for animation */
            animation: slideUp 0.6s ease-out forwards;
        }

        /* Hover Effects */
        .card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--glass-highlight);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            background: rgba(255, 255, 255, 0.08);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }

        .card:hover::before {
            left: 100%;
        }

        .card-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent);
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .card-title {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        .card-desc {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .card-arrow {
            margin-top: 1.5rem;
            align-self: flex-end;
            color: var(--text-main);
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .card:hover .card-arrow {
            transform: translateX(5px);
            color: var(--accent);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Loader */
        .loader {
            text-align: center;
            color: var(--text-secondary);
            padding: 2rem;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            main { padding: 2rem 1rem; }
        }
    </style>
</head>
<body>

    <!-- 3D Background Container -->
    <div id="canvas-container"></div>

    <main>
        <header>
            <h1>Project Universe</h1>
            <p class="subtitle">A showcase of my digital creations</p>
        </header>

        <div id="grid-container" class="grid">
            <div class="loader">Loading projects...</div>
        </div>
    </main>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- PART 1: DYNAMIC CONTENT SYSTEM (NO CACHE VERSION) ---
        
        async function loadSites() {
            const container = document.getElementById('grid-container');
            
            try {
                // FIXED: Added timestamp (?t=...) and cache: 'no-store' to bypass GitHub/Browser caching
                const response = await fetch(`./sites.json?t=${new Date().getTime()}`, {
                    cache: "no-store"
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const sites = await response.json();
                
                // Clear loader
                container.innerHTML = '';

                // Generate HTML for each site
                sites.forEach((site, index) => {
                    const card = document.createElement('a');
                    card.href = site.url;
                    card.className = 'card';
                    card.target = '_blank'; // Open in new tab
                    card.style.animationDelay = `${index * 0.1}s`; // Staggered animation

                    card.innerHTML = `
                        <div>
                            <div class="card-category">${site.category || 'Website'}</div>
                            <h2 class="card-title">${site.title}</h2>
                            <p class="card-desc">${site.description}</p>
                        </div>
                        <div class="card-arrow">→</div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error("Could not load sites:", error);
                container.innerHTML = `
                    <div style="color: #ef4444; text-align: center; grid-column: 1/-1;">
                        Error loading projects. Ensure sites.json exists and is valid.
                    </div>`;
            }
        }

        // Initialize Content
        loadSites();


        // --- PART 2: 3D BACKGROUND (Three.js) ---

        const scene = new THREE.Scene();
        // Add subtle fog for depth
        scene.fog = new THREE.FogExp2(0x000000, 0.002);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Performance optimization
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 1. Create Floating Geometric Shapes
        const geometry = new THREE.IcosahedronGeometry(10, 1);
        const material = new THREE.MeshPhongMaterial({ 
            color: 0x64ffda, 
            wireframe: true,
            transparent: true,
            opacity: 0.15,
            side: THREE.DoubleSide
        });
        
        const mainShape = new THREE.Mesh(geometry, material);
        scene.add(mainShape);

        // 2. Create Starfield / Particles
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 700;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            // Spread particles across a wide area
            posArray[i] = (Math.random() - 0.5) * 50; 
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.05,
            color: 0xffffff,
            transparent: true,
            opacity: 0.8
        });

        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x64ffda, 1);
        pointLight.position.set(25, 25, 25);
        scene.add(pointLight);

        camera.position.z = 20;

        // Interaction Variables
        let mouseX = 0;
        let mouseY = 0;

        // Handle Mouse Move
        document.addEventListener('mousemove', (event) => {
            mouseX = event.clientX / window.innerWidth - 0.5;
            mouseY = event.clientY / window.innerHeight - 0.5;
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            // Rotate main shape
            mainShape.rotation.x += 0.001;
            mainShape.rotation.y += 0.002;

            // Rotate particles slowly
            particlesMesh.rotation.y = -mouseX * 0.5;
            particlesMesh.rotation.x = -mouseY * 0.5;

            // Parallax effect on main shape
            mainShape.position.x += (mouseX * 2 - mainShape.position.x) * 0.05;
            mainShape.position.y += (-mouseY * 2 - mainShape.position.y) * 0.05;

            renderer.render(scene, camera);
        }

        animate();

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
